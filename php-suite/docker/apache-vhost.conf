<VirtualHost *:10000>
    ServerName localhost
    DocumentRoot /var/www/html

    # Render terminates HTTPS at its edge and forwards plain HTTP with this header.
    # Telling PHP the original request was HTTPS makes $_SERVER['HTTPS'] correct.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Shared PHP includes are loaded by the server, never requested by browsers
    <Directory /var/www/html/includes>
        Require all denied
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
