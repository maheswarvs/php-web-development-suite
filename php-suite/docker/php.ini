; Application PHP settings (loaded after the image defaults)
date.timezone = Asia/Kolkata
expose_php = Off
display_errors = Off
log_errors = On

; Sessions
session.save_path = "/var/lib/php/sessions"
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 7200

; Sets cookie flags (Secure behind Render's HTTPS) before any script runs.
; Lives outside the web root, so it is not reachable from a browser.
auto_prepend_file = /usr/local/etc/php/session-init.php
